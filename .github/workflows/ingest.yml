name: Ingest Training Data

on:
  push:
    branches: [main, master]
    paths:
      - 'raw/**'

jobs:
  process-files:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pymupdf python-docx openpyxl pandas
      
      - name: Run ingest processor
        id: ingest
        run: |
          echo "🚀 Запуск ingest processor..."
          python scripts/ingest_processor.py
          
          # Считаем статистику
          TOTAL_FILES=$(python -c "import json; data=json.load(open('knowledge-base/index.json')); print(data['total_files'])")
          DOCS_COUNT=$(python -c "import json; data=json.load(open('knowledge-base/index.json')); print(len(data['categories']['docs']))")
          DATA_COUNT=$(python -c "import json; data=json.load(open('knowledge-base/index.json')); print(len(data['categories']['data']))")
          MEDIA_COUNT=$(python -c "import json; data=json.load(open('knowledge-base/index.json')); print(len(data['categories']['media']))")
          
          echo "total_files=$TOTAL_FILES" >> $GITHUB_OUTPUT
          echo "docs_count=$DOCS_COUNT" >> $GITHUB_OUTPUT
          echo "data_count=$DATA_COUNT" >> $GITHUB_OUTPUT
          echo "media_count=$MEDIA_COUNT" >> $GITHUB_OUTPUT
      
      - name: Configure Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
      
      - name: Commit processed files
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "Нет изменений для коммита"
            exit 0
          fi
          
          git commit -m "$(cat <<EOF
auto: Process training data from raw/

Files processed: ${{ steps.ingest.outputs.total_files }}
- docs: ${{ steps.ingest.outputs.docs_count }}
- data: ${{ steps.ingest.outputs.data_count }}
- media: ${{ steps.ingest.outputs.media_count }}

Knowledge base updated: knowledge-base/index.json

🤖 Auto-generated by ingest.yml workflow
EOF
)"
          git push origin HEAD:main || git push origin HEAD:master
      
      - name: Send update event to developer-core
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          TARGET_REPO: CarmiBanxe/developer-core
        run: |
          if [[ -z "$SYNC_TOKEN" ]]; then
            echo "::warning::SYNC_TOKEN не установлен, пропускаем отправку события"
            exit 0
          fi
          
          echo "📡 Отправка события training-data-updated в $TARGET_REPO..."
          
          curl -X POST \
            "https://api.github.com/repos/$TARGET_REPO/dispatches" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $SYNC_TOKEN" \
            -d '{
              "event_type": "training-data-updated",
              "client_payload": {
                "source_repo": "CarmiBanxe/banxe-training-data",
                "files_processed": "${{ steps.ingest.outputs.total_files }}",
                "updated_at": "'"$(date -Iseconds)"'"
              }
            }'
          
          echo "✅ Событие отправлено"
      
      - name: Generate summary
        run: |
          echo "## 📊 Ingest Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total files processed:** ${{ steps.ingest.outputs.total_files }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Docs | ${{ steps.ingest.outputs.docs_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Data | ${{ steps.ingest.outputs.data_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Media | ${{ steps.ingest.outputs.media_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Knowledge base:** \`knowledge-base/index.json\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Sync status:** Event sent to developer-core ✅" >> $GITHUB_STEP_SUMMARY
